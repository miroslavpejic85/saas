<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Login - Email OTP</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <main class="container">
            <h1>Login</h1>
            <p>Enter your email. You'll receive a confirmation code.</p>

            <div class="card">
                <label>Email</label>
                <input id="email" type="email" placeholder="you@example.com" />

                <button class="btn" id="send">Send code</button>

                <hr />

                <label>Code</label>
                <input id="code" type="text" placeholder="123456" />

                <button class="btn" id="verify">Verify & Login</button>

                <button class="btn secondary" id="logout">Logout</button>
            </div>

            <pre id="out" class="status"></pre>

            <p><a href="/">Home</a></p>
        </main>

        <script src="/js/app.js"></script>
        <script src="/js/login.js"></script>
    </body>
</html>
